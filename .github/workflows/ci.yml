name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Package the app with its own runtime
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew :app:jpackage --console=plain
          Compress-Archive -Path app/build/jpackage/AimTune -DestinationPath app/build/AimTune-windows.zip
      - name: Smoke test of the packaged app (no Java on the path)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $env:JAVA_HOME = $null
          $env:AIMTUNE_DATA_DIR = Join-Path $env:RUNNER_TEMP "aimtune-smoke"
          $out = Join-Path $env:RUNNER_TEMP "aimtune-shots"
          $p = Start-Process -FilePath app/build/jpackage/AimTune/AimTune.exe -ArgumentList "--screenshots",$out -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "packaged app exited with $($p.ExitCode)" }
          if ((Get-ChildItem $out -Filter *.png).Count -lt 20) { throw "packaged app rendered too few screens" }
      - name: Upload distribution
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: aimtune-dist
          path: |
            app/build/distributions/*.zip
            app/build/AimTune-windows.zip
