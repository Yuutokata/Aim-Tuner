name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Package the app with its own runtime
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew :app:jpackage --console=plain
          Compress-Archive -Path app/build/jpackage/AimTune -DestinationPath app/build/AimTune-windows.zip
      - name: Upload distribution
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: aimtune-dist
          path: |
            app/build/distributions/*.zip
            app/build/AimTune-windows.zip
