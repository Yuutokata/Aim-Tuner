name: Release

# Push a tag like v0.2.0 to build the Windows app and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v") -replace "[-+].*$", ""
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "tag must look like v1.2.3, was ${{ github.ref_name }}" }
          "number=$v" >> $env:GITHUB_OUTPUT

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Package the app with its own runtime
        shell: pwsh
        run: |
          ./gradlew :app:jpackage "-PappVersion=${{ steps.version.outputs.number }}" --console=plain
          Compress-Archive -Path app/build/jpackage/AimTune -DestinationPath app/build/AimTune-${{ github.ref_name }}-windows.zip

      # The runner has no GPU and no desktop, so the app cannot open its window here: the gate is only that the bundled
      # runtime works without Java on the path. The launch below has a hard time limit and never fails the release.
      - name: Check the packaged runtime (no Java on the path)
        shell: pwsh
        run: |
          $env:JAVA_HOME = $null
          $app = "app/build/jpackage/AimTune"
          if (-not (Test-Path "$app/AimTune.exe")) { throw "AimTune.exe is missing" }
          & "$app/runtime/bin/java.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "the bundled runtime does not start" }

      - name: Try to launch the packaged app (information only)
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $env:JAVA_HOME = $null
          $env:AIMTUNE_DATA_DIR = Join-Path $env:RUNNER_TEMP "aimtune-smoke"
          $p = Start-Process -FilePath app/build/jpackage/AimTune/AimTune.exe -ArgumentList "--no-update-check" -PassThru
          if ($p.WaitForExit(45000)) { Write-Host "the app exited early with code $($p.ExitCode) (no GPU on the runner is expected)" }
          else { Write-Host "the app is running after 45 s"; Stop-Process -Id $p.Id -Force }

      # The installer needs the WiX toolset; if the runner lacks it, the release still gets the zip.
      - name: Build the installer (.exe)
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          ./gradlew :app:jpackage "-PappVersion=${{ steps.version.outputs.number }}" -PinstallerType=exe --console=plain
          $exe = Get-ChildItem app/build/jpackage -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName "app/build/AimTune-${{ github.ref_name }}-setup.exe"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("app/build/AimTune-${{ github.ref_name }}-windows.zip")
          $setup = "app/build/AimTune-${{ github.ref_name }}-setup.exe"
          if (Test-Path $setup) { $files += $setup }
          gh release create "${{ github.ref_name }}" @files --title "AimTune ${{ github.ref_name }}" --generate-notes --verify-tag
