accel.baseline_low=Das ist niedrig: ein längerer Sensitivity-Test vorab gibt einen besseren Start.
accel.windows_on=Die Windows-Zeigerbeschleunigung ist an; schalte sie aus, sie würde die Kalibrierung verfälschen.
