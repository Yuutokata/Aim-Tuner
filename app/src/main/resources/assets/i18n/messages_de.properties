accel.title=Beschleunigung
accel.needs_raw_input=Die verwendete Mauseingabe ({0}) stempelt nicht jeden Report einzeln, daher lässt sich die Geschwindigkeit deiner Bewegungen für die Beschleunigung nicht gut genug messen. Beschleunigung braucht Windows Raw Input, das unter Windows der Standard ist.
accel.intro=Manche Spieler zielen besser, wenn die Sensitivity von der Handgeschwindigkeit abhängt. Empfohlen ist eine Blind-Suche: In etwa {0} Runden spielt AimTune verschiedene Kurvenstärken (darunter auch gar keine Kurve) mit deiner Sensitivity, ohne dir zu sagen welche, findet die Stärke, mit der du am besten triffst, und testet sie dann blind gegen die normale Sensitivity. Der andere Weg analysiert zuerst in {1} normalen Runden, wie deine ersten Bewegungen danebengehen; das findet nur große Vorlieben. Die Kurve wird hier nur simuliert; ist sie klar besser, kannst du eine Settings-Datei für Raw Accel exportieren.
