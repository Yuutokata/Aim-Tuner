onboarding.flash.title=Von Flashes wegdrehen
onboarding.flash.description=Wie oft musst du dich von einem Flash wegdrehen und dann zurückdrehen? AimTune spielt dafür ein Flash-Szenario, so oft wie du angibst. Du kannst das später in den Einstellungen ändern.
