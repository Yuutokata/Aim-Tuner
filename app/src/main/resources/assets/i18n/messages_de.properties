accel.experimental=Experimentell. In Simulationen fand die Blind-Suche Kurvenvorlieben ab 15 %, die Fehleranalyse nur große (fallender Gain ab 25 %). Das alles stammt von simulierten Spielern; ob echte Spieler solche Vorlieben haben, ist nicht bekannt. „Keine Kurve“ heißt nicht, dass dir keine Kurve helfen könnte.
accel.analysis.trial_hint=Du kannst trotzdem eine sanfte Kurve (etwa 15 % Gain-Änderung, mit der Geschwindigkeit steigend oder fallend) blind gegen deine normale Sensitivity testen. Direkt nach dem Wechsel fühlt sich eine neue Kurve meist schlechter an und schneidet schlechter ab; nur ein klarer Sieg zählt.
accel.result.trial_note=Das war eine Testkurve auf deinen Wunsch, keine, die in deinen Daten gefunden wurde. Der Test ist blind, das Ergebnis zählt also trotzdem.
results.equivalent=Zwischen {0} und {1} cm/360° waren deine Ergebnisse etwa gleich gut. Ein Unterschied von 15 % liegt unter dem, was dieser Test messen kann – der Wert oben ist die Mitte eines Bereichs, kein exaktes Optimum.
results.equivalent_flat=Deine Ergebnisse waren von {0} bis {1} cm/360° etwa gleich gut. Jeder Wert in diesem Bereich ist in diesem Test genauso gut wie ein anderer; nimm den, der sich am besten anfühlt, und behalte ihn lange genug, um dich daran zu gewöhnen.
history.share=Daten für die Forschung teilen
share.title=Daten für die Forschung teilen
share.intro=Wenn du helfen willst zu prüfen, ob AimTune bei echten Menschen funktioniert, kannst du deine gespeicherten Runden in eine Datei exportieren und sie selbst an die Forscherin oder den Entwickler schicken, die danach gefragt haben. AimTune lädt nichts hoch und verschickt die Datei nicht.
share.contains_title=Was die Datei enthält
share.contains=Für jede Runde: die Mausbewegungen (Counts und ihre Zeiten), wo Ziele erschienen sind und ob Schüsse getroffen haben, die Sensitivity (cm/360°), deine DPI, das Spiel und die Punkte.
share.not_contains_title=Was sie nicht enthält
share.not_contains=Deinen Namen, den Computer- oder Benutzernamen, Dateipfade, Datum oder Uhrzeit (Sessions bekommen nur eine Tagesnummer ab deiner ersten) oder etwas über andere Programme.
