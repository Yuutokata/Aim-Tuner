accel.search.offer_note=Nach {0} Runden hat eine Stärke am besten abgeschnitten, und ihr Bereich liegt auf einer Seite von „keine Kurve“. Das ist ein Hinweis, noch kein Ergebnis: Teste sie blind gegen deine normale Sensitivity, bevor du sie benutzt.
