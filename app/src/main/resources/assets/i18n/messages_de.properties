accel.between.explain_calibration=Spiele wie gewohnt mit deiner empfohlenen Sensitivity. Die Runden mischen Flicks, kleine Anpassungen und Zielwechsel, denn die Kurve wird danach beurteilt, wie deine ersten Bewegungen bei verschiedenen Geschwindigkeiten danebengehen. Ab {0} Runden kannst du früher auswerten; mehr Runden machen das Ergebnis zuverlässiger.
accel.between.explain_test=Jedes Paar hat eine Runde mit deiner normalen Sensitivity und eine mit der Kurve, in zufälliger Reihenfolge und mit identischen Zielen. Dir wird nicht gesagt, welche welche ist. Der Test endet, sobald das Ergebnis klar ist, oder nach {0} Paaren.
