accel.title=Acceleration
accel.needs_raw_input=The mouse input in use ({0}) does not time each report on its own, so the speed of your movements cannot be measured well enough for acceleration. Acceleration needs Windows Raw Input, which is the default on Windows.
accel.intro=Some players aim better when the sensitivity depends on hand speed. The recommended way is a blind search: over about {0} rounds AimTune plays different curve strengths (some of them no curve at all) at your sensitivity without telling you which, finds the strength that scores best for you, and then tests it blind against plain sensitivity. The other way first analyses how your first movements miss in {1} plain rounds, which finds only large preferences. The curve is only simulated here; if it is clearly better you can export a settings file for Raw Accel.
