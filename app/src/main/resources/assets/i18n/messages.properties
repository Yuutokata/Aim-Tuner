hub.set.rotation.name=Rotation
hub.set.rotation.what=Turns every mouse movement by an angle before anything else happens. It helps when your hand, grip or sensor is tilted, so that a straight move sideways ends slightly up or down. A positive angle turns movements clockwise on screen.
hub.set.rotation.formula=x' = x × cos(angle) - y × sin(angle)    y' = x × sin(angle) + y × cos(angle)
hub.set.rotation.why=A reach is one movement to a new target. AimTune measures the angle between the direction of the first movement and the direction to the target. If your hand is turned, all first movements are turned by the same angle, so the opposite rotation straightens them. It recommends a value only when the range excludes 0° and the offset is at least 1°. The range is a 95 % interval.
hub.set.yx.name=Y/X ratio
hub.set.yx.what=Multiplies all vertical movement by a factor, so your vertical sensitivity differs from the horizontal one. 1.00 means both are the same.
hub.set.yx.formula=y' = y × ratio    (after the curve)
hub.set.yx.why=For targets to the right and below, AimTune compares how far your first movement went along that axis with how far the target was. The usual undershoot of first movements is in both and cancels in the ratio. A value is recommended only when the range excludes 1.00 and the change is at least 5 %.
hub.set.lr.name=L/R ratio
hub.set.lr.what=Multiplies movement to the left by a factor, to make up for a hand that moves further one way than the other. 1.00 means left and right are the same.
hub.set.lr.formula=x' = x × ratio    if x < 0 (left)
hub.set.lr.why=AimTune compares how far your first movements went for targets to the right and to the left, relative to the target distance. A value is recommended only when the range excludes 1.00 and the change is at least 5 %.
hub.set.ud.name=U/D ratio
hub.set.ud.what=Multiplies upward movement by a factor (on top of the Y/X ratio). 1.00 means up and down are the same.
hub.set.ud.formula=y' = y × ratio    if y < 0 (up)
hub.set.ud.recommended=No recommendation. The measured number is shown for information only.
hub.set.ud.why=AimTune compares your first movements to targets below and above, like the other ratios, and shows the number. It does not recommend a value.
hub.set.ud.not_measured=Upward reaches are rare, and when the check was run with the spread of real hands, it recommended a change in 8 % of cases where nothing was wrong (the limit is 5 %). So the number can mislead, and AimTune never turns it into a recommendation.
hub.set.snap.name=Angle snapping
hub.set.snap.what=Snaps a movement to the horizontal or vertical axis when its direction is within the angle of that axis. It is decided for every mouse report on its own.
hub.set.snap.formula=angle < s: y' = 0        angle > 90° - s: x' = 0        (angle = angle of the report to the horizontal)
hub.set.snap.recommended=0° (off)
hub.set.snap.why=At 1000 Hz a report is only one or two counts, so its angle is mostly rounding, and snapping acts on every single report. Even 5° removes a large share of the vertical counts while you move sideways. Whether those counts were drift or corrections is what the replay below measures on your own rounds.
hub.set.snap.not_measured=A blind test could not find the effect: it is below what 12-round stages can detect. The replay runs your stored movements through the driver model with snapping, but it is open loop: you would have corrected a snapped movement differently.
hub.set.speed_cap.name=Input speed cap
hub.set.speed_cap.what=Limits the speed of the mouse movement itself: a faster movement is scaled down to the cap, in inches per second. 0 switches it off.
hub.set.speed_cap.formula=speed = movement × (1000 ÷ DPI) ÷ report time        movement = movement × min(speed, cap) ÷ speed
hub.set.speed_cap.recommended=0 (off)
hub.set.speed_cap.why=A cap below your fastest flicks shortens exactly the movements that matter most; a cap above them does nothing. Your own speeds are listed here, so you can see where a cap would start to bite.
hub.set.speed_cap.not_measured=A cap changes your hand's movement itself, so there is nothing to test it against: it can only take speed away. The numbers are all AimTune needs to recommend off.
hub.set.smoothing.name=Smoothing
hub.set.smoothing.what=Three optional averages, each with a half-life in milliseconds: input smoothing (of the speed the curve sees), scale smoothing (of the multiplier) and output smoothing (of the movement itself). 0 switches one off.
hub.set.smoothing.formula=an old value counts half as much after one half-life        output smoothing: the output movement is averaged over time
hub.set.smoothing.recommended=0 for all three
hub.set.smoothing.why=Input and scale smoothing only make the multiplier less jumpy, and what they change is tiny. Output smoothing delays every movement. It adds lag, and lag hurts aim.
hub.set.smoothing.not_measured=A calmer multiplier changes the score by about a point, far less than the round-to-round noise (a standard deviation of about 13), so a blind test cannot find a difference. Output smoothing adds lag, which is a known harm and needs no test.
hub.set.stretch.name=Domain and range stretch
hub.set.stretch.what=Weights the horizontal part of a movement against the vertical part. The domain stretch changes the speed the curve sees, the range stretch changes how strongly the curve acts, each per axis. 1 and 1 means no stretch.
hub.set.stretch.formula=speed = (|x| × domain x, |y| × domain y) ÷ report time        multiplier = 1 + (curve - 1) × range weight
hub.set.stretch.recommended=1 and 1 (no stretch)
hub.set.stretch.why=Both only change how the curve treats the vertical share of a movement. Without a reason to treat up and down differently, equal weights keep the response the same in every direction.
hub.set.stretch.not_measured=Most of your movement lies close to horizontal, so the effect of a stretch is below what AimTune can measure with a blind test.
hub.set.component.name=Whole or by component, Lp norm
hub.set.component.what=Whole: the curve reads the combined speed of both axes. By component: each axis has its own speed and curve. The Lp norm sets how the two axes combine to one speed: 2 is the normal length, 16 or more is the larger of the two.
hub.set.component.formula=speed = (|x|^p + |y|^p)^(1/p)        p = 2: the normal length
hub.set.component.recommended=Whole, Lp norm 2
hub.set.component.why=Whole with 2 gives the same response in every direction, which is what you want for aim. By component makes diagonal movement accelerate less than straight movement.
hub.set.component.not_measured=The modes differ only on diagonal movement, and diagonals are a small share of the stored rounds, so the effect is below what a blind test can measure.
hub.set.polling.name=Polling rate and time
hub.set.polling.what=Raw Accel works out speed as movement divided by the time between reports. With a polling rate and the constant time interval option it uses a fixed time instead of the measured one; minimum and maximum time limit the measured time.
hub.set.polling.formula=speed = movement × (1000 ÷ DPI) ÷ time        time = measured time between min and max, or 1000 ÷ rate when locked
hub.set.polling.recommended=Automatic: rate 0, constant time interval off
hub.set.polling.why=The measured time is what the driver is built for. A lock only smooths the speed a little, and a wrong value distorts every speed the curve sees.
hub.set.polling.not_measured=AimTune plays your values exactly (the driver model includes them) but does not judge them: the effect on the multiplier is below what a blind test can measure.
hub.export.note=The file goes to the export folder, never into the folder of Raw Accel itself. Copy it over yourself and check it in Raw Accel. Changes marked "not blind-tested" come from your stored rounds, so try them in the game before you keep them.
