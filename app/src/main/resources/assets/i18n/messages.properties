history.share=Share data for research
share.title=Share data for research
share.intro=If you want to help check whether AimTune works for real people, you can export your stored rounds into one file and send it yourself to the researcher or developer who asked for it. AimTune never uploads anything and does not send the file anywhere.
share.contains_title=What the file contains
share.contains=For every round: the mouse movements (counts and their times), where targets appeared and whether shots hit or missed, the sensitivity (cm/360°), your DPI, the game and the scores.
share.not_contains_title=What it does not contain
share.not_contains=Your name, the computer or user name, file paths, the date or time of day (sessions only get a day number counted from your first one), or anything about other programs.
